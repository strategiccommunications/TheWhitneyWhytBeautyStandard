<x-dc>
<helmet>
<style>@font-face{font-family:'Bodoni Moda';font-style:normal;font-weight:400;src:url(fonts/bodoni-moda-latin-400-normal.woff2)}
@font-face{font-family:'Bodoni Moda';font-style:italic;font-weight:400;src:url(fonts/bodoni-moda-latin-400-italic.woff2)}
@font-face{font-family:'Instrument Sans';font-weight:400;src:url(fonts/instrument-sans-latin-400-normal.woff2)}

@font-face{font-family:'Bodoni Moda';font-style:italic;font-weight:500;src:url(fonts/bodoni-moda-latin-500-italic.woff2)}

@font-face{font-family:'Bodoni Moda';font-style:italic;font-weight:600;src:url(fonts/bodoni-moda-latin-600-italic.woff2)}
@font-face{font-family:'Instrument Sans';font-weight:600;src:url(fonts/instrument-sans-latin-600-normal.woff2)}
</style>
<style>
body{margin:0;background:#F8F0E9}
h1,h2,h3,p{margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
a{text-decoration:none;color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.drift{animation:drift 7s ease-in-out infinite}
.hv{transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s,background-color .3s,border-color .3s}
.hv:hover{transform:translateY(-6px);box-shadow:0 22px 40px -22px rgba(42,20,32,.45)}
.hr{transition:background-color .25s,padding .3s}
.hr:hover{background-color:rgba(184,90,70,.10)}
.nav{transition:background-color .25s,transform .25s}
.nav:hover{background-color:rgba(184,90,70,.22);transform:scale(1.08)}
.pill{transition:background-color .25s,color .25s,transform .25s}
.pill:hover{transform:translateY(-2px)}
.bar{transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.rise,.drift,.bar{animation:none}*{transition:none!important}}
</style>
</helmet>
<div style="position:relative;width:1280px;height:720px;overflow:hidden;background:#F8F0E9;color:#2A1420;font-family:'Instrument Sans',system-ui,sans-serif;font-size:17px;line-height:1.45">

<div style="position:absolute;inset:0;padding:44px 72px 0;box-sizing:border-box;z-index:1">
<div style="font-size:13px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#B0493A;line-height:1.2">Part nine &middot; Reporting &amp; analysis</div><h1 style="font-family:'Bodoni Moda',Georgia,serif;font-weight:500;font-size:40px;line-height:1.08;letter-spacing:-0.01em;max-width:1136px;margin-top:10px;color:#2A1420">Big reach, soft conversion &mdash; <em style='color:#B0493A;font-weight:400'>here&rsquo;s why</em></h1><div style="display:flex;gap:44px;margin-top:20px">
<div style="width:640px;flex:none">
<div style="display:grid;grid-template-columns:168px 1fr 62px;gap:14px;font-size:11.5px;letter-spacing:.18em;font-weight:600;color:#B0493A;padding-bottom:6px;border-bottom:1.5px solid #2A1420"><div>KPI &middot; target &rarr; actual</div><div>% of target (line = 100%)</div><div style="text-align:right">Result</div></div>
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="9">
<div class="hr" style="display:grid;grid-template-columns:168px 1fr 62px;gap:14px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(42,20,32,0.16)">
<div><div style="font-size:14.5px;font-weight:600;line-height:1.15">{{k.name}}</div><div style="font-size:12.5px;color:#6A5360">{{k.t}} &rarr; {{k.a}}</div></div>
<div style="position:relative;height:16px"><div class="bar" style="position:absolute;left:0;top:0;height:16px;width:{{k.w}}%;background:{{k.c}};border-radius:0 4px 4px 0"></div><div style="position:absolute;left:23.8%;top:-6px;bottom:-6px;width:1.5px;background:#2A1420"></div></div>
<div style="text-align:right;font-family:'Bodoni Moda',serif;font-size:18px;color:{{k.c}}">{{k.p}}</div></div></sc-for></div>
<div style="flex:1;min-width:0"><div style="display:grid;gap:8px" role="group" aria-label="Analysis">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button class="pill" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="text-align:left;padding:10px 16px;border-radius:8px;border:1px solid rgba(42,20,32,0.16);font-size:12.5px;letter-spacing:.16em;font-weight:600;background:{{t.bg}};color:{{t.fg}}">{{t.l}}</button></sc-for></div>
<div class="rise" style="margin-top:14px;padding:20px 22px;border-radius:10px;background:#FFF9F4;border:1px solid rgba(42,20,32,0.16);font-size:17px;line-height:1.5;min-height:140px">{{body}}</div></div></div>
</div>
<div style="position:absolute;left:72px;right:72px;bottom:22px;display:flex;align-items:center;justify-content:space-between;z-index:2">
<div style="font-size:13px;letter-spacing:0.08em;color:#6A5360">WhitneyWhytBeauty &middot; 90-Day Plan</div>
<div style="display:flex;align-items:center;gap:12px"><span style="font-size:13px;letter-spacing:0.12em;color:#6A5360;margin-right:6px">16 / 20</span><a class="nav" href="S15.html" aria-label="Previous slide" style="width:44px;height:44px;border-radius:50%;border:1px solid rgba(42,20,32,0.16);display:flex;align-items:center;justify-content:center;color:#2A1420"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3 5 9l6 6"/></svg></a><a class="nav" href="S17.html" aria-label="Next slide" style="width:44px;height:44px;border-radius:50%;border:1px solid rgba(42,20,32,0.16);display:flex;align-items:center;justify-content:center;color:#2A1420"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3l6 6-6 6"/></svg></a></div>
</div>
<div style="position:absolute;left:0;bottom:0;height:4px;width:80.00%;background:#B0493A;z-index:3"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
constructor(...a) { super(...a); this.state = {sel:1}; }
renderVals() {
const s = this.state; const set = (o) => this.setState(o);
const K=[["Instagram Reach","500,000","720,000",500000,720000],["Engagement Rate","4%","2.1%",4,2.1],["Profile Visits","10,000","17,500",10000,17500],["Qualified Enquiries","300","185",300,185],["Bookings","150","92",150,92],["Repeat Bookings","30%","18%",30,18],["Founder Video Views","100,000","410,000",100000,410000],["Video Saves/Shares","5,000","2,200",5000,2200],["Website/Booking Clicks","2,500","1,400",2500,1400]];
const T=[["WORKING","Founder content is the growth engine — reach, video views and profile visits beat target by wide margins"],["NOT WORKING","Attention isn't converting: engagement, saves, clicks, enquiries and bookings all trail — a mid-funnel leak, not an awareness problem"],["INVESTIGATE & CHANGE","Check the booking link, CTA clarity and DM response time; add one clear CTA per founder video and simplify the booking path in Month 2"],["DON'T OVERREACT TO","Engagement rate alone — reach and saves moved in opposite directions, so the raw rate is noisy this early"],["GREATEST ATTENTION & ADDITIONAL DATA","Bookings and enquiries deserve the most management focus; request DM response times, booking-link click-through and no-show rate from the client"]];
return {kpis:K.map(k=>{const p=Math.round(k[4]/k[3]*100);return {name:k[0],t:k[1],a:k[2],p:p+"%",w:Math.min(p,420)/420*100,c:p>=100?"#2A1420":"#C9705F"};}),tabs:T.map((t,i)=>{const on=s.sel===i;return {l:t[0],on:on,bg:on?"#2A1420":"#FFF9F4",fg:on?"#F8F0E9":"#2A1420",pick:()=>set({sel:i})};}),body:T[s.sel][1]};
}
}
</script>
