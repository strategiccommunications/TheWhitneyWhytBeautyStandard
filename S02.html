body{margin:0;background:#F8F0E9}
h1,h2,h3,p{margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
a{text-decoration:none;color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.pill{transition:background-color .25s,color .25s,transform .25s}
.pill:hover{transform:translateY(-2px)}
.bar{transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.rise,.drift,.bar{animation:none}*{transition:none!important}}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
constructor(...a) { super(...a); this.state = {sel:0}; }
renderVals() {
const s = this.state; const set = (o) => this.setState(o);
const D=[["01","Plan","Parts 01 – 02",[0,1]],["02","Execute","Parts 03 – 06",[2,3,4,5]],["03","Measure","Part 07",[6]],["04","Optimise","Parts 08 – 10",[7,8,9]]];
const T=["Brand & business diagnosis, audience segments","Founder-led brand strategy for Whitney","90-day roadmap: Build, Grow, Scale","Content direction & the flagship Q1 campaign","PR strategy: angles, media, founder visibility","Digital growth funnel & conversion mapping","Q1 KPI framework — vanity vs. business metrics","Month 1 results: reporting & diagnostic analysis","Execution test: three real creative outputs","Budget allocation & what success looks like"];
const act=D[s.sel][3];
return {steps:D.map((d,i)=>{const on=s.sel===i;return {num:d[0],name:d[1],parts:d[2],on:on,bg:on?"#2A1420":"#FFF9F4",fg:on?"#F8F0E9":"#2A1420",tag:on?"#F2A99A":"#B0493A",pick:()=>set({sel:i})};}),items:T.map((t,i)=>({n:String(i+1).padStart(2,"0"),t:t,op:act.indexOf(i)>-1?1:0.32}))};
}
}
</script>
